<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" role="img" aria-labelledby="t d">
  <title id="t">The planned MudVault Mesh</title>
  <desc id="d">Three linked gateway nodes each serve their own MUDs. If one gateway fails, its MUDs reconnect to another. MUDs remain clients and do not relay.</desc>
  <rect width="1000" height="440" rx="16" fill="#1d2021"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace">
    <text x="40" y="48" font-size="22" font-weight="700" fill="#fabd2f">Planned: linked gateway nodes</text>
    <text x="40" y="76" font-size="14" fill="#a89984">Gateways relay between themselves. MUDs stay simple clients and fail over.</text>

    <g stroke="#fabd2f" stroke-width="3" stroke-dasharray="9 7">
      <path d="M500 174 L268 306"/>
      <path d="M500 174 L732 306"/>
      <path d="M268 306 L732 306"/>
    </g>
    <text x="500" y="298" text-anchor="middle" font-size="12" fill="#fabd2f">authenticated gateway links</text>

    <g stroke="#8ec07c" stroke-width="2">
      <path d="M500 174 L382 122"/>
      <path d="M500 174 L618 122"/>
      <path d="M268 306 L112 262"/>
      <path d="M268 306 L112 372"/>
      <path d="M732 306 L888 262"/>
      <path d="M732 306 L888 372"/>
    </g>

    <g text-anchor="middle" font-size="14">
      <g fill="#32302f" stroke="#fabd2f" stroke-width="2.5">
        <rect x="430" y="146" width="140" height="56" rx="10"/>
        <rect x="198" y="278" width="140" height="56" rx="10"/>
        <rect x="662" y="278" width="140" height="56" rx="10"/>
      </g>
      <g fill="#fabd2f" font-weight="700">
        <text x="500" y="179">Gateway 1</text>
        <text x="268" y="311">Gateway 2</text>
        <text x="732" y="311">Gateway 3</text>
      </g>
      <g fill="#282828" stroke-width="2">
        <rect x="312" y="100" width="92" height="40" rx="8" stroke="#d3869b"/>
        <rect x="596" y="100" width="92" height="40" rx="8" stroke="#83a598"/>
        <rect x="40" y="242" width="92" height="40" rx="8" stroke="#fe8019"/>
        <rect x="40" y="352" width="92" height="40" rx="8" stroke="#8ec07c"/>
        <rect x="868" y="242" width="92" height="40" rx="8" stroke="#b8bb26"/>
        <rect x="868" y="352" width="92" height="40" rx="8" stroke="#d3869b"/>
      </g>
      <g fill="#ebdbb2">
        <text x="358" y="125">MUD</text>
        <text x="642" y="125">MUD</text>
        <text x="86" y="267">MUD</text>
        <text x="86" y="377">MUD</text>
        <text x="914" y="267">MUD</text>
        <text x="914" y="377">MUD</text>
      </g>
    </g>
  </g>
</svg>
