name: Uptime

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Restore last known state
        uses: actions/cache/restore@v4
        with:
          path: .uptime-state.json
          key: uptime-state-${{ github.run_id }}
          restore-keys: uptime-state-

      - name: Check the mesh
        id: probe
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.MESH_UPTIME_WEBHOOK }}
        run: node scripts/uptime-check.mjs

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .uptime-state.json
          key: uptime-state-${{ github.run_id }}
